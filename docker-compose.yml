services:
  web:
    build: .
    image: ghcr.io/liwoyuandiane/love:latest
    container_name: love_web
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      # 一键数据目录：把宿主机 love/ 整体挂载到 /data
      # 容器启动时自动检测 love/.env（无则进安装向导），自动创建 uploads/cache/logs/sessions
      - ./:/data
    environment:
      DATA_DIR: /data
    restart: always
