services:
  web:
    build: .
    image: ghcr.io/liwoyuandiane/love:latest
    container_name: love_web
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      # 所有数据统一存放在项目目录（love/）下，方便查找和管理
      - ./uploads:/var/www/html/assets/uploads
      - ./cache:/var/www/html/cache
      - ./logs:/var/www/html/logs
      - ./sessions:/var/lib/php/sessions
      - ./.env:/var/www/html/.env:ro
    environment:
      # 从 .env 读取数据库连接（.env 已被 .gitignore 排除，不会进 git）
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    restart: always