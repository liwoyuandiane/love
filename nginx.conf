gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1k;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

location / {
    try_files $uri $uri/ /router.php?$query_string;
}

# 禁止访问敏感文件（与 docker-nginx.conf 对齐）：
# .env（数据库凭据）、.git（仓库历史）、日志与缓存目录
location ~ /\. {
    deny all;
}
location ~ \.(env|log|ini)$ {
    deny all;
}
location ~ ^/(logs|cache)/ {
    deny all;
}
location = /Dockerfile { deny all; }
location = /docker-compose.yml { deny all; }
location = /CLAUDE.md { deny all; }

# 上传目录禁止执行任何脚本（纵深防御）
location ~ ^/assets/uploads/.*\.(php|phtml|php[0-9]|pl|py|cgi|sh|exe)$ {
    deny all;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass unix:/tmp/php-cgi.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://api.github.com; media-src 'self' https://music.163.com https://*.music.126.net http://*.music.126.net;" always;