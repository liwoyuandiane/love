server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # 上传限制与 PHP-FPM socket
    client_max_body_size 25m;

    # 请求体给 PHP 的配置（对齐 .user.ini）
    fastcgi_param PHP_VALUE "upload_max_filesize=20M\npost_max_size=25M\nmemory_limit=128M\nmax_execution_time=300\nmax_input_time=300";

    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
    }
    location ~ \.(env|git|gitignore|dockerignore|htaccess|htpasswd)$ {
        deny all;
    }
    location = /Dockerfile { deny all; }
    location = /docker-compose.yml { deny all; }
    location = /CLAUDE.md { deny all; }

    # 上传目录禁止执行任何脚本（纵深防御）
    location ~ ^/assets/uploads/.*\.(php|phtml|php[0-9]|pl|py|cgi|sh|exe)$ {
        deny all;
    }

    # 静态资源直接服务 + 长期缓存
    location ~* \.(css|js|woff2?|ttf|eot|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /router.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 安全响应头（与 config.php 对齐）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data: https:; img-src 'self' data: https:; connect-src 'self'; media-src 'self' https://music.163.com https://*.music.126.net http://*.music.126.net;" always;
}